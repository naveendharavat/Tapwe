<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapwe — Smart NFC &amp; QR business cards (UI/UX design)</title>
<meta name="description" content="Smart NFC and QR cards that connect your business to the digital world with one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#fbfaf8;--surface:#fff;--subtle:#f4f2ee;--line:#e7e4de;--line2:#d6d2ca;
  --ink:#1c1b22;--ink2:#4a4953;--ink3:#6b6a75;
  --b50:#f0f0ff;--b100:#e4e4fd;--b500:#5a4fd8;--b600:#4a3fc4;--b700:#3d33a8;--b900:#231d62;
  --ok:#14774a;--okbg:#e8f5ee;--err:#b42318;--errbg:#fdeceb;--warn:#8a5a00;--warnbg:#fdf3dc;
  --r:10px;--rl:14px;
  --sh:0 1px 2px rgb(28 27 34/.04),0 1px 1px rgb(28 27 34/.03);
  --lift:0 10px 30px -12px rgb(28 27 34/.18),0 2px 6px rgb(28 27 34/.05);
  --dev:0 40px 70px -30px rgb(35 29 98/.35),0 12px 24px -12px rgb(28 27 34/.2);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--canvas);color:var(--ink);font:400 16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{letter-spacing:-.02em;text-wrap:balance;line-height:1.15}
p{text-wrap:pretty}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--b500);outline-offset:2px;border-radius:4px}
::selection{background:var(--b100)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1152px;margin:0 auto;padding:0 24px}
@media(max-width:640px){.wrap{padding:0 16px}}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--b600);margin-bottom:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r);font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;border:1px solid transparent}
.btn svg{font-size:16px}
.btn.lg{height:48px;padding:0 24px;font-size:16px}.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.icon{width:36px;height:36px;padding:0}
.btn-p{background:var(--b600);color:#fff;box-shadow:var(--sh)}.btn-p:hover{background:var(--b700)}.btn-p:active{background:var(--b900)}
.btn-s{background:var(--surface);border-color:var(--line2)}.btn-s:hover{background:var(--subtle)}
.btn-g{color:var(--ink2)}.btn-g:hover{background:var(--subtle);color:var(--ink)}
.btn-d{background:var(--err);color:#fff}.btn-d:hover{background:#8f1b11}
.btn-w{background:#fff;color:var(--b900)}.btn-w:hover{background:var(--b50)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--subtle);color:var(--ink2)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.brand{background:var(--b50);color:var(--b700)}
.ico{width:44px;height:44px;border-radius:var(--r);background:var(--b50);color:var(--b600);display:grid;place-items:center;font-size:20px}
.ico.outline{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);width:40px;height:40px}

/* forms */
.field{display:grid;gap:6px}
.field label,.legend{font-size:14px;font-weight:500}
.input,select.input{height:40px;width:100%;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);padding:0 12px;font:inherit;font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--ink3)}
.input:hover{border-color:var(--ink3)}
.input:focus{outline:0;border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}
.input.bad{border-color:var(--err)}.input.bad:focus{box-shadow:0 0 0 3px var(--errbg)}
.hint{font-size:13px;color:var(--ink3)}.err{font-size:13px;color:var(--err)}
.pwd{position:relative}.pwd .input{padding-right:42px}
.pwd button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px;color:var(--ink3);border-radius:6px}.pwd button:hover{color:var(--ink)}

/* header / footer */
header.top{position:sticky;top:0;z-index:40;background:rgb(251 250 248/.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.logo svg{width:32px;height:32px}
nav.main{display:flex;gap:4px}
nav.main a{padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink2)}
nav.main a:hover,nav.main a.on{color:var(--ink)}
.bar .actions{display:flex;gap:8px}
.burger{display:none;width:40px;height:40px;border-radius:var(--r);place-items:center;font-size:20px}.burger:hover{background:var(--subtle)}
#mnav{display:none;border-top:1px solid var(--line);padding:12px 16px 20px}
#mnav a.l{display:block;padding:12px;border-radius:8px;font-weight:500;color:var(--ink2)}
#mnav a.l:hover{background:var(--subtle)}
#mnav .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
#mnav.open{display:block}
@media(max-width:820px){nav.main,.bar .actions{display:none}.burger{display:grid}}
footer.foot{border-top:1px solid var(--line);background:rgb(244 242 238/.6);margin-top:0}
.fgrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px;padding:56px 0 8px}
.fgrid h3{font-size:14px;margin-bottom:16px}.fgrid li{list-style:none;margin-bottom:10px}.fgrid ul{padding:0}
.fgrid li a{font-size:14px;color:var(--ink2)}.fgrid li a:hover{color:var(--ink)}
.copy{border-top:1px solid var(--line);margin-top:48px;padding:24px 0;font-size:14px;color:var(--ink3)}
@media(max-width:820px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}}

/* sections */
section.s{padding:80px 0}
section.s.alt{background:var(--surface);border-block:1px solid var(--line)}
.sh{max-width:680px;margin:0 auto 56px;text-align:center}
.sh h2{font-size:clamp(28px,4vw,40px);font-weight:600}
.sh p{margin-top:16px;font-size:18px;color:var(--ink2)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding:80px 0}
.hero h1{font-size:clamp(38px,5.4vw,64px);font-weight:600;line-height:1.06}
.hero h1 em{font-style:normal;color:var(--b600)}
.hero p.lead{margin-top:24px;font-size:18px;line-height:1.65;color:var(--ink2);max-width:560px}
.hero .cta{display:flex;gap:12px;margin-top:32px}
@media(max-width:960px){.hero{grid-template-columns:1fr;padding:48px 0 56px;gap:48px}}
@media(max-width:520px){.hero .cta{flex-direction:column}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 32px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g3,.g4,.g2{grid-template-columns:1fr}}
.step{padding:24px;background:var(--canvas);border:1px solid var(--line);border-radius:var(--rl)}
.step .t{display:flex;justify-content:space-between;align-items:center;color:var(--ink3);font-size:14px;font-weight:500}
.step h3,.uc h3{font-size:18px;margin-top:20px}.step p,.uc p{margin-top:8px;color:var(--ink2)}
.feat h3{font-size:16px;margin-top:16px}.feat p{margin-top:6px;font-size:14px;line-height:1.6;color:var(--ink2)}
.uc{padding:24px;transition:transform .2s,box-shadow .2s}.uc:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.uc h3{font-size:16px;margin-top:16px}.uc p{font-size:14px;margin-top:6px}
.showcase{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.showcase h2{font-size:clamp(28px,4vw,40px);font-weight:600}
.showcase .lead{margin-top:16px;font-size:18px;color:var(--ink2);line-height:1.65}
.ticks{list-style:none;padding:0;margin-top:24px;display:grid;gap:12px}
.ticks li{display:flex;gap:12px;color:var(--ink2)}.ticks svg{color:var(--b600);font-size:20px;margin-top:2px}
.panel{background:rgb(240 240 255/.6);border:1px solid var(--line);border-radius:var(--rl);padding:40px}
@media(max-width:900px){.showcase{grid-template-columns:1fr;gap:40px}.panel{padding:24px}}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:32px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font:12px ui-monospace,Menlo,monospace;color:var(--ink2)}
.chip svg{color:var(--b600);font-size:14px}
.band{background:var(--b900);color:#fff;border-radius:var(--rl);text-align:center;padding:64px 24px}
.band h2{font-size:clamp(28px,4vw,40px);font-weight:600}.band p{max-width:560px;margin:16px auto 0;color:rgb(255 255 255/.75);font-size:18px}.band .btn{margin-top:32px}
.pagehead{background:var(--surface);border-bottom:1px solid var(--line);padding:72px 0}
.pagehead h1{font-size:clamp(34px,5vw,52px);font-weight:600;max-width:760px}.pagehead p{margin-top:20px;font-size:18px;color:var(--ink2);max-width:620px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding:40px 0}
.frow h2{font-size:clamp(24px,3vw,32px);font-weight:600;margin-top:20px}.frow .lead{margin-top:12px;font-size:18px;line-height:1.65;color:var(--ink2)}
.frow.rev .txt{order:2}
@media(max-width:900px){.frow{grid-template-columns:1fr;gap:28px}.frow.rev .txt{order:0}}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:960px){.flow{grid-template-columns:1fr 1fr}}@media(max-width:560px){.flow{grid-template-columns:1fr}}
.flow .card{padding:20px;position:relative}.flow h3{font-size:16px;margin-top:16px}.flow p{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.6}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);font-size:14px;background:var(--warnbg);color:var(--warn);border:1px solid rgb(138 90 0/.25);margin-bottom:32px}
.plan{padding:24px}.plan.f{border-color:var(--b500);box-shadow:0 0 0 1px var(--b500)}
.plan .price{font-size:32px;font-weight:600;color:var(--ink3);margin-top:16px}.plan .price small{font-size:16px;font-weight:400}
.plan ul{list-style:none;padding:0;margin:24px 0;display:grid;gap:10px;font-size:14px;color:var(--ink2)}.plan li{display:flex;gap:10px}.plan li svg{color:var(--b600);margin-top:3px}

@media(max-width:640px){.sc2{grid-template-columns:1fr!important}.sc2>div:last-child{max-width:200px!important}}

/* team */
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:760px;margin:0 auto}
.person{padding:28px;display:flex;gap:20px;align-items:flex-start}
.person .av{width:64px;height:64px;border-radius:50%;background:var(--b100);color:var(--b700);display:grid;place-items:center;font-size:20px;font-weight:600;flex:none}
.person h3{font-size:18px}.person .role{margin-top:4px;font-size:14px;font-weight:500;color:var(--b600)}
.person p{margin-top:12px;font-size:14px;line-height:1.6;color:var(--ink2)}
@media(max-width:700px){.team{grid-template-columns:1fr}}
/* mockups */
.hm{position:relative;width:100%;max-width:520px;margin:0 auto;padding:16px 0 24px}
.hm .bg{position:absolute;inset:40px 24px auto;height:78%;border-radius:28px;background:var(--b50);z-index:-1}
.hm .ph{width:44%;margin-left:auto}
.hm .tap{position:absolute;left:38%;top:34%;width:40px;height:40px}
.hm .tap i{position:absolute;inset:0;border-radius:50%;border:1px solid rgb(90 79 216/.6);animation:ring 2.4s ease-out infinite}
.hm .tap b{position:absolute;inset:0;border-radius:50%;background:#fff;color:var(--b600);box-shadow:var(--lift);display:grid;place-items:center;font-size:16px}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@media(max-width:520px){.hm .ph{width:56%}.hm .tap{display:none}}
.phone{position:relative;aspect-ratio:9/18.5;width:100%;border:7px solid var(--ink);border-radius:35px;background:var(--ink);box-shadow:var(--dev)}
.phone .notch{position:absolute;left:50%;top:8px;width:64px;height:16px;border-radius:999px;background:var(--ink);transform:translateX(-50%);z-index:2}
.phone .scr{height:100%;border-radius:27px;background:var(--canvas);padding:36px 12px 12px;display:flex;flex-direction:column;overflow:hidden}
.phone .av{width:56px;height:56px;border-radius:50%;background:var(--b100);color:var(--b700);display:grid;place-items:center;font-weight:600;font-size:18px;margin:0 auto}
.phone .nm{text-align:center;font-weight:600;font-size:14px;margin-top:10px}.phone .sb{text-align:center;font-size:11px;color:var(--ink3)}
.phone .lk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.phone .lk div,.phone .fb{display:flex;align-items:center;gap:6px;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:10px;font-weight:500;white-space:nowrap;min-width:0}
.phone .fb{margin-top:6px;padding:9px 10px;font-size:11px}
.phone svg.i{color:var(--b600);font-size:13px}
.phone .pbtn{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:6px;background:var(--b600);color:#fff;border-radius:8px;padding:10px;font-size:12px;font-weight:500}
.phone .pbtn svg{color:#fff}

/* dashboard */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column}
.side .logo{padding:4px 8px}.side nav{margin-top:24px;flex:1;overflow:auto}
.side nav,.drawer nav{display:grid;gap:4px;align-content:start}
.side nav a,.drawer nav a{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink2);transition:background .15s}
.side nav a:hover,.drawer nav a:hover{background:var(--subtle);color:var(--ink)}.side nav a.on,.drawer nav a.on{background:var(--b50);color:var(--b700)}
.side nav svg,.drawer nav svg{font-size:16px}
.apmain{min-width:0}
.atop{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 32px;border-bottom:1px solid var(--line);background:rgb(251 250 248/.92);backdrop-filter:blur(8px)}
.acontent{max-width:1024px;margin:0 auto;padding:32px}
.menu-btn{display:none}
.user{display:flex;gap:8px;align-items:center;padding:6px 10px 6px 6px;border-radius:8px;font-size:14px;font-weight:500}.user:hover{background:var(--subtle)}
.user i{width:32px;height:32px;border-radius:50%;background:var(--b100);color:var(--b700);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:14px}
.ptitle{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.ptitle h1{font-size:24px;font-weight:600}.ptitle p{margin-top:6px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stats .card{padding:20px}.stats p{font-size:14px;color:var(--ink2)}.stats b{display:block;font-size:30px;font-weight:600;margin-top:8px}
.twrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--rl);background:var(--surface);box-shadow:var(--sh)}
table{width:100%;min-width:640px;border-collapse:collapse;font-size:14px;text-align:left}
th{background:rgb(244 242 238/.6);font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--canvas)}
td.id{font:12px ui-monospace,Menlo,monospace;color:var(--ink2)}td.dest{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
td.act{text-align:right;padding:8px 12px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r);background:var(--subtle);margin-bottom:20px}
.tabs button{padding:6px 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink3);text-transform:capitalize}
.tabs button:hover{color:var(--ink)}.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px;border:1px dashed var(--line2);border-radius:var(--rl);background:var(--surface)}
.empty .ico{border-radius:50%;width:48px;height:48px}.empty h2{font-size:18px;margin-top:16px;font-weight:600}.empty p{margin-top:6px;color:var(--ink2);max-width:380px}.empty .row{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.skel{height:56px;border-radius:var(--r);background:var(--subtle);animation:pulse 1.4s ease-in-out infinite;margin-bottom:12px}
@keyframes pulse{50%{opacity:.5}}
.menu{position:absolute;right:12px;z-index:20;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);padding:4px;text-align:left;animation:up .15s ease-out}
.menu button,.menu a{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border-radius:6px;font-size:14px;color:var(--ink2);text-align:left}
.menu button:hover,.menu a:hover{background:var(--subtle);color:var(--ink)}.menu .dng{color:var(--err)}.menu .dng:hover{background:var(--errbg);color:var(--err)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
dialog{border:1px solid var(--line);border-radius:var(--rl);padding:24px;width:min(440px,calc(100% - 32px));box-shadow:var(--lift);color:var(--ink);background:#fff;margin:auto}
dialog::backdrop{background:rgb(28 27 34/.4)}dialog h2{font-size:18px;font-weight:600}dialog>p{margin-top:6px;color:var(--ink3);font-size:14px}
dialog form{margin-top:20px;display:grid;gap:20px}dialog .row{display:flex;justify-content:flex-end;gap:12px}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:32px;list-style:none;padding:0}
.progress li{display:grid;gap:8px;font-size:14px;font-weight:500;color:var(--ink3)}.progress li:before{content:"";height:4px;border-radius:99px;background:var(--line)}
.progress li.on{color:var(--ink)}.progress li.on:before,.progress li.done:before{background:var(--b600)}.progress li.done{color:var(--ink3)}
.cc{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:start}
.cc .card.f{padding:24px}.cc aside{position:sticky;top:88px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.opt{display:flex;gap:12px;padding:14px;border:1px solid var(--line2);border-radius:var(--r);cursor:pointer;transition:background .15s}
.opt:hover{background:var(--subtle)}.opt:has(input:checked){border-color:var(--b500);background:rgb(240 240 255/.6);box-shadow:0 0 0 1px var(--b500)}
.opt input{position:absolute;opacity:0}.opt svg{color:var(--b600);font-size:20px;margin-top:2px}.opt b{display:block;font-size:14px;font-weight:500}.opt span{font-size:14px;color:var(--ink3)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{padding:8px 12px;border:1px solid var(--line2);border-radius:var(--r);font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer}

.pc-wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%}
.pc-ic{position:absolute;width:9cqw;height:9cqw;color:#fff;opacity:.55;transform:rotate(var(--r,0deg));display:grid}.pc-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pc-insta{--ac:#e1306c;background:linear-gradient(165deg,#f9a03f 0%,#e1306c 48%,#6d3fc4 100%)}
.pc-review{--ac:#f5a524;background:linear-gradient(165deg,#3b82f6,#1d4ed8)}.pc-review .pc-badge svg{fill:#f5a524;stroke:#f5a524}
.pc-review .pc-body{margin:3cqw 6cqw 0;background:#fff;border-radius:6cqw;flex:1;padding:5cqw 17cqw}.pc-review .pc-qr{box-shadow:none;padding:0}

.pc-menu .pc-badge{background:transparent;box-shadow:none;color:#1d1a14;width:16cqw;height:16cqw}.pc-menu .pc-badge svg{width:100%;height:100%;stroke-width:1.6}

.pc-leaves{position:absolute;inset:0;width:100%;height:100%}

/* ---------- helpers ---------- */
function toast(msg,tone='ok'){const t=document.createElement('div');t.className='toast '+(tone==='ok'?'':'error');t.setAttribute('role','status');t.innerHTML=`${ic(tone==='ok'?'check':'alert')}<span>${esc(msg)}</span><button class="btn icon btn-g sm" aria-label="Dismiss notification" style="width:28px;height:28px">${ic('x')}</button>`;$('button',t).onclick=()=>t.remove();$('#toasts').append(t);setTimeout(()=>t.remove(),3600)}
async function copy(t){
 try{await navigator.clipboard.writeText(t);toast('Card URL copied to clipboard.')}
 catch{try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();ok?toast('Card URL copied to clipboard.'):toast('Could not copy. Select the URL and copy it manually.','error')}catch{toast('Could not copy. Select the URL and copy it manually.','error')}}}

function route(){const h=location.hash.replace(/^#\/?/,'');const [path,anchor]=h.split('#');return{path:path.split('?')[0].replace(/\/$/,''),anchor}}
function render(){
 closeMenu();clearInterval(demoT);
 const {path,anchor}=route();

 else if(path==='sign-in'||path==='sign-up')html=pages[path]();
 else html=(pages[path]||pages[''])();
 $('#view').innerHTML=html;

 render.keep=false;

function bindReq(){
 const f=$('#reqf');
 const map={name:'rq-name',biz:'rq-biz',email:'rq-email',phone:'rq-phone',type:'rq-type',qty:'rq-qty',dests:'rq-dest',ok:'rq-ok'};
 const set=(id,m)=>{const e=$('#'+id+'-e'),el=$('#'+id);if(e)e.textContent=m||'';if(el){el.classList.toggle('bad',!!m);m?el.setAttribute('aria-invalid','true'):el.removeAttribute('aria-invalid')}return !m};
 const focusId=id=>{const el=$('#'+id);(el.matches('input,select,textarea')?el:$('input',el)).focus()};
 /* clear a field's error as soon as the user fixes it */
 const live=e=>{const t=e.target;const id=t.name==='rqd'?'rq-dest':t.id;if(Object.values(map).includes(id)&&$('#'+id+'-e')?.textContent)set(id,'')};
 f.addEventListener('input',live);f.addEventListener('change',live);
 f.onsubmit=ev=>{ev.preventDefault();
  const vals={name:$('#rq-name').value,biz:$('#rq-biz').value,email:$('#rq-email').value,phone:$('#rq-phone').value,type:$('#rq-type').value,qty:$('#rq-qty').value,dests:$$('input[name=rqd]:checked').map(i=>i.value),ok:$('#rq-ok').checked};
  const er=validate(S.request,vals),bad=[];
  Object.entries(map).forEach(([k,id])=>{if(!set(id,er[k]||''))bad.push(id)});
  if(bad.length){focusId(bad[0]);return}
  const b=$('#rqbtn');b.disabled=true;b.innerHTML='<span class="spin"></span>Sending';
  setTimeout(()=>{
   $('#rqbox').innerHTML=`<div class="rqok"><div class="big">${ic('check')}</div><h2>Request received</h2><p>Thanks, ${esc(vals.name.trim().split(/\s+/)[0])}. This is a design preview, so nothing was actually sent.</p><dl><div><dt>Business</dt><dd>${esc(vals.biz.trim())}</dd></div><div><dt>Cards</dt><dd>${esc(vals.qty)}</dd></div><div><dt>Card opens</dt><dd>${esc(vals.dests.join(', '))}</dd></div></dl><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px"><a class="btn btn-s" href="#/">Back to home</a><button class="btn btn-p" id="rqagain">Submit another request</button></div></div>`;
   toast('Request received (demo).');$('#rqbox').scrollIntoView({behavior:'smooth',block:'center'});$('#rqagain').onclick=()=>{render.keep=true;render()}},700)};
}
function reveal(){const els=$$('.rv');if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches){els.forEach(e=>e.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.06});els.forEach(e=>io.observe(e))}

  $$('[data-dtab]').forEach(b=>b.onclick=()=>{clearInterval(demoT);show(b.dataset.dtab)});
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)demoT=setInterval(()=>show(keys[(cur+1)%keys.length]),4200)}
 const b=$('#burger');if(b)b.onclick=()=>{const o=$('#mnav').classList.toggle('open');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu');b.innerHTML=ic(o?'x':'burger')};
 $$('#mnav a').forEach(a=>a.addEventListener('click',()=>$('#mnav').classList.remove('open')));
 /* auth */
 const af=$('#authf');if(af){const up=!!$('#name');
  $('#pwt').onclick=()=>{const p=$('#pw');const s=p.type==='password';p.type=s?'text':'password';$('#pwt').innerHTML=ic(s?'eyeoff':'eye');$('#pwt').setAttribute('aria-label',s?'Hide password':'Show password')};
  af.onsubmit=e=>{e.preventDefault();const er=validate(up?S.signUp:S.signIn,{name:up?$('#name').value:'',email:$('#email').value,pw:$('#pw').value});
   ['name','email','pw'].forEach(k=>{const el=$('#'+(k==='pw'?'pw':k)),m=$('#'+k+'-e');if(!el)return;m.textContent=er[k]||'';el.classList.toggle('bad',!!er[k]);er[k]?el.setAttribute('aria-invalid','true'):el.removeAttribute('aria-invalid')});
   if(Object.keys(er).length)return;
   const sb=$('#sbtn');sb.disabled=true;sb.innerHTML='<span class="spin"></span>'+sb.textContent;
   setTimeout(()=>{toast(up?'Demo account created.':'Signed in to the demo dashboard.');location.hash='#/app'},700)}}
 /* dashboard chrome */
 const dopen=$('#dopen');if(dopen){const dr=$('#drawer');dopen.onclick=()=>dr.classList.add('open');$('#dclose').onclick=$('#dclose2').onclick=()=>dr.classList.remove('open');$$('#drawer a').forEach(a=>a.onclick=()=>dr.classList.remove('open'))}
 const um=$('#umenu');if(um)um.onclick=e=>{e.stopPropagation();if(openMenu==='user')return closeMenu();closeMenu();openMenu='user';um.setAttribute('aria-expanded','true');um.parentElement.insertAdjacentHTML('beforeend',`<div class="menu" role="menu" style="right:0;top:44px"><a role="menuitem" href="#/app/settings">${ic('gear')}Account Settings</a><a role="menuitem" href="#/">${ic('logout')}Sign out</a></div>`)};
 /* cards table */
 $$('[data-filter]').forEach(t=>t.onclick=()=>{filter=t.dataset.filter;render.keep=true;render()});
 $$('[data-state]').forEach(t=>t.onclick=()=>{if(t.dataset.state==='loading'){loadCards();render.keep=true;render()}else{cardsView='error';render.keep=true;render()}});
 const ca=$('#clearall');if(ca)ca.onclick=()=>{cards=[];render.keep=true;render()};
 const rs=$('#restore');if(rs)rs.onclick=()=>{cards=seed();render.keep=true;render()};
 $$('[data-menu]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const id=btn.dataset.menu;if(openMenu===id)return closeMenu();closeMenu();openMenu=id;btn.setAttribute('aria-expanded','true');
  btn.parentElement.insertAdjacentHTML('beforeend',`<div class="menu" role="menu" style="top:44px"><button role="menuitem" data-a="copy">${ic('copy')}Copy card URL</button><a role="menuitem" href="#/app/qr?card=${id}">${ic('qr')}View QR code</a><button role="menuitem" data-a="edit">${ic('edit')}Request a change</button><hr><button role="menuitem" class="dng" data-a="del">${ic('trash')}Delete card</button></div>`);
  const c=cards.find(x=>x.id===id);
  $('.menu [data-a=copy]').onclick=()=>{closeMenu();copy(cardUrl(id))};
  $('.menu [data-a=edit]').onclick=()=>{closeMenu();const d=dialog(`<h2>Request a change</h2><p>${esc(c.name)} keeps the same card URL. Tell us what it should open and our team will update it.</p><form method="dialog" id="ef"><div class="field"><label for="ed">What should it open?${R}</label><input class="input" id="ed" placeholder="e.g. our new menu link"></div><div class="row"><button class="btn btn-s" type="button" id="ecancel">Cancel</button><button class="btn btn-p" type="submit">Send request</button></div></form>`);
   $('#ecancel').onclick=()=>d.close();$('#ef').onsubmit=e=>{e.preventDefault();const v=$('#ed').value.trim();if(!v)return;d.close();toast('Change request sent. Our team will update it.');render.keep=true;render()}};
  $('.menu [data-a=del]').onclick=()=>{closeMenu();const d=dialog(`<h2>Delete this card?</h2><p>“${esc(c.name)}” will be removed from this demo list.</p><form method="dialog"><div class="row"><button class="btn btn-s" type="button" id="dcancel">Cancel</button><button class="btn btn-d" type="submit">Delete card</button></div></form>`);
   $('#dcancel').onclick=()=>d.close();$('#dlg form').onsubmit=e=>{e.preventDefault();cards=cards.filter(x=>x.id!==id);d.close();toast('Card deleted.');render.keep=true;render()}}});
 const qs=$('#qsel');if(qs)qs.onchange=()=>{location.hash='#/app/qr?card='+qs.value};
 /* create card */
 if($('#ccwrap'))bindCC();
 /* simple forms */
 const pf=$('#pform');if(pf)pf.onsubmit=e=>{e.preventDefault();toast('Profile saved (demo).')};
 const sf=$('#sform');if(sf)sf.onsubmit=e=>{e.preventDefault();toast('Account details saved (demo).')};
}
function bindCC(){
 const redraw=()=>{$('#ccwrap').outerHTML=ccBody();bindCC()};
 $$('input[name=exp]').forEach(r=>r.onchange=()=>{cc.exp=r.value;cc.type=exps.find(e=>e[0]===r.value)[4];cc.err={};const pv=$('#ccprev');if(pv)pv.innerHTML=tapCard(expTheme[cc.exp]||'brand',{id:cc.id})});
 $$('input[name=dt]').forEach(r=>r.onchange=()=>{cc.type=r.value;cc.err={};redraw()});
 $$('[data-ctab]').forEach(t=>t.onclick=()=>{cc.tab=t.dataset.ctab;redraw()});
 const sync=()=>{const n=$('#cn');if(n)cc.name=n.value;const b=$('#biz');if(b)cc.biz=b.value;const v=$('#dv');if(v)cc.value=v.value};
 $$('#ccwrap input.input').forEach(i=>i.oninput=()=>{sync();const nm=$('.sum div:nth-child(1) dd');if(nm)nm.textContent=cc.name.trim()||'Untitled card';const tg=$('.sum div:nth-child(3) dd');if(tg)tg.textContent=cc.type==='profile'?(cc.biz.trim()||'Your digital profile'):(cc.value.trim()||'Not set yet')});
 const nx=$('#cnext');if(nx)nx.onclick=()=>{sync();const e={};
  if(cc.step===0)Object.assign(e,validate(S.ccBasics,{name:cc.name}));
  if(cc.step===1)Object.assign(e,validate(S.ccDest(cc.type),{biz:cc.biz,value:cc.value}));
  cc.err=e;if(!Object.keys(e).length)cc.step++;redraw();const f=$('#ccwrap .input.bad');if(f)f.focus()};
 const bk=$('#cback');if(bk)bk.onclick=()=>{sync();cc.step=Math.max(0,cc.step-1);cc.err={};redraw()};
 const sv=$('#csave');if(sv)sv.onclick=()=>{cc.saving=true;redraw();setTimeout(()=>{cards.unshift({id:cc.id,name:cc.name.trim(),status:'Active',type:cc.type,dest:cc.type==='profile'?'Profile: '+cc.biz.trim():cc.value.trim()});
  Object.assign(cc,{step:0,name:'',exp:'business',type:'profile',value:'',biz:'',id:'',err:{},saving:false,tab:'nfc'});toast('Card created. Its permanent URL is ready to use.');location.hash='#/app/cards'},700)};
}
document.addEventListener('click',e=>{
 if(openMenu&&!e.target.closest('.menu'))closeMenu();
 const c=e.target.closest('[data-copy]');if(c)return copy(c.dataset.copy);
 if(e.target.closest('#dlqr'))downloadQr(curSub()==='create'?cc.id:($('#qsel')?.value||''))});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.documentElement.classList.add('js');
if(curSub()==='cards')loadCards();
render();
</script>
